<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Movie Watchlist</h1>
        <p>Keep Track of Movies You Want to Watch</p>
    </header>

    <div class="watchlist_section">

        <!-- images/movies -->

        <div class="movie_tracker">

            <h2>Add a Movie</h2>

            <form id="movieWatchForm">

                <div class="form-group">
                    <label for="movieName">
                        Movie Title
                    </label>

                    <input type="text" id="movieName" name="movieName" placeholder="Enter movie title">

                    <span class="error" id="titleMessage"></span>
                </div>

                <div class="form-group">
                    <label for="movieGenre">
                        Genre
                    </label>

                    <select id="movieGenre" name="movieGenre">

                        <option value="">
                            Choose a genre
                        </option>

                        <option value="Action">
                            Action
                        </option>

                        <option value="Comedy">
                            Comedy
                        </option>

                        <option value="Drama">
                            Drama
                        </option>

                        <option value="Horror">
                            Horror
                        </option>

                        <option value="Sci-Fi">
                            Sci-Fi
                        </option>

                        <option value="Fantasy">
                            Fantasy
                        </option>

                    </select>

                    <span class="error" id="genreMessage"></span>
                </div>

                <button type="submit">
                    Add Movie
                </button>

            </form>

            <p id="movieFormMessage"></p>

            <ul id="movieCollection"></ul>

            <p id="emptyWatchlist">
                Your watchlist is empty. Add a movie to get started.
            </p>

        </div>

    </div>

</body>

</html>
